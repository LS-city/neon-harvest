<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyDex</title>
<meta name="description" content="MyDex: your gamer card, Fight Card and Cyber Soldier Card in one place. Find players, trade badges, and discover local spots on Radar.">
<meta name="theme-color" content="#080c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyDex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#080c1c;color:#eef2ff;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#dex{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#boot b{font:700 34px system-ui;letter-spacing:.14em;color:#7ceaff}
#boot p{margin:0;color:#b8c2e8;max-width:320px;line-height:1.5}
#boot[hidden]{display:none}
#install{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;gap:8px;align-items:center;background:#111a3a;border:1px solid #7ceaff;color:#eef2ff;padding:10px 12px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 24px)}
#install[hidden]{display:none}
#install button{font:600 14px system-ui;border-radius:8px;padding:9px 12px;border:0;cursor:pointer;min-height:40px}
#install .go{background:#7ceaff;color:#080c1c}
#install .no{background:transparent;color:#b8c2e8;border:1px solid #33407a}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../neon-harvest/firebase-config.js"></script>
<script src="../neon-harvest/nh-firebase.js"></script>
</head>
<body>
<div id="boot" role="status"><b>MYDEX</b><p id="bootmsg">Loading your MyDex…</p></div>
<div id="install" hidden><span id="instxt">Add MyDex to your home screen</span><button class="go" id="instgo" type="button">Install</button><button class="no" id="instno" type="button" aria-label="Not now">Later</button></div>
<script>
(function(){
  "use strict";
  // Same account as NEON HARVEST: your card, badges and fights are shared between the game and this app.
  const RESERVED=["vex","admin","staff","system","depot clerk","moderator","owner","anthropic","claude"];
  const cleanName=s=>Array.from(String(s||"").normalize("NFC").replace(/[\u0000-\u001f\u007f-\u009f­​-‏ -‮⁠-⁯﻿]/g,"").replace(/\s+/g," ").trim()).slice(0,16).join("");
  const nameProblem=n=>{const l=Array.from(n).length;if(l<3)return"Use at least 3 characters.";if(l>16)return"Keep it to 16 characters or fewer.";if(RESERVED.includes(n.toLowerCase()))return"That name is reserved.";if(!/[\p{L}\p{N}]/u.test(n))return"Include at least one letter or number.";return null};
  const toast=t=>{const d=document.createElement("div");d.textContent=t;d.setAttribute("role","status");d.style.cssText="position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9;background:#111a3a;border:1px solid #7ceaff;color:#eef2ff;padding:10px 14px;border-radius:10px;font:14px system-ui;max-width:90%";document.body.append(d);setTimeout(()=>d.remove(),2600)};

  async function start(){
    if(!window.claude||!window.claude.use){ document.getElementById("bootmsg").textContent="MyDex couldn't connect. Check your internet and reload."; return; }
    const [u,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    const id=u?await u.id():null;
    if(!u||!db||!id){ document.getElementById("bootmsg").textContent="Sign in to open your MyDex."; return; }
    let name="";
    try{ const s=await db.doc("data/users/"+id+"/save").get(); if(s.exists) name=String(s.data().name||""); }catch(e){}
    if(!name) name=(await u.name())||"Runner";
    let admin=false; try{ admin=!!(await u.isOwner()); }catch(e){}
    window.NHMYDEX={
      nameIssue:n=>{const c=cleanName(n);if(c!==String(n).trim())return"Remove the unusual characters from that name.";if(c.toLowerCase()==="rassir"&&!admin)return"That name is reserved.";return nameProblem(c)},
      db:()=>db, uid:()=>id, name:()=>name, isAdmin:()=>admin,
      close:()=>{ if(confirm("Sign out of MyDex?")) window.claude.signOut().then(()=>location.reload()); },
      toast:t=>toast(t), art:()=>"",
      forgeList:()=>({items:[],weapons:[],wardrobe:[],vehicles:[],parts:[],pcs:[],drugs:[],pets:[]}),
      online:()=>[], forgeCan:()=>false, forgePay:()=>{}
    };
    const fr=document.createElement("iframe");
    fr.id="dex"; fr.title="MyDex"; fr.setAttribute("allow","geolocation");
    fr.src="../neon-harvest/mydex.html?v=20&app=1"+(location.hash||"");
    fr.addEventListener("load",()=>{
      document.getElementById("boot").hidden=true;
      // In the app there is no game to go back to, so the "Back to NEON HARVEST" button is hidden.
      try{ const st=fr.contentDocument.createElement("style"); st.textContent='.top [data-a="closeDex"]{display:none!important}'; fr.contentDocument.head.append(st); }catch(e){}
    });
    document.body.append(fr);
  }
  start().catch(()=>{ document.getElementById("bootmsg").textContent="Something went wrong loading MyDex. Reload to try again."; });

  // Installable app.
  if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  const bar=document.getElementById("install"); let ev=null;
  const dismissed=()=>{try{return localStorage.getItem("mydex_install_no")==="1"}catch(e){return false}};
  addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; if(!dismissed()) bar.hidden=false; });
  document.getElementById("instgo").onclick=async()=>{ bar.hidden=true; if(ev){ ev.prompt(); try{ await ev.userChoice; }catch(e){} ev=null; } };
  document.getElementById("instno").onclick=()=>{ bar.hidden=true; try{localStorage.setItem("mydex_install_no","1")}catch(e){} };
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(ios&&!standalone&&!dismissed()){ document.getElementById("instxt").textContent="Install: tap Share, then “Add to Home Screen”"; document.getElementById("instgo").hidden=true; bar.hidden=false; }
})();
</script>
</body>
</html>
