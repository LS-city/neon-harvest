<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>MyDex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one phone-height field unit that opens like a book; every tab is a page turned from the spine. */
:root{
  color-scheme:dark;
  --th:230; --ink:hsl(var(--th) 56% 7%); --shell:hsl(var(--th) 57% 14%); --panel:hsl(var(--th) 55% 19%); --line:hsl(var(--th) 43% 35%);
  --ice:#7ceaff; --flux:#ff4fb0; --text:#eef2ff; --dim:hsl(var(--th) 42% 78%);
  --go:#3dff9a; --warn:#ffd83d; --stop:#ff4d5e;
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#view>*,#sheet>*{flex:none}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
h1,h2,h3,p{margin:0}
#stage{height:100%;max-width:460px;margin:0 auto;position:relative;overflow:hidden;background:var(--shell)}
#app{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;perspective:1400px}

.top{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--dim)}
.top b{font:700 17px var(--display);letter-spacing:.14em;color:var(--ice);margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--line);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ice)}
.chip.off i{background:var(--dim)}
.lockbtn{width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ice)}
.lockbtn svg{width:20px;height:20px}

#view{overflow-y:auto;overflow-x:hidden;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;transform-origin:left center;-webkit-overflow-scrolling:touch}
#view.turn{animation:turn .42s cubic-bezier(.2,.8,.25,1)}
@keyframes turn{from{transform:rotateY(62deg);opacity:.15;box-shadow:inset 90px 0 70px rgba(0,0,0,.7)}to{transform:none;opacity:1}}

nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--ink);padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
nav button{padding:9px 2px 6px;display:grid;justify-items:center;gap:2px;font:12px var(--mono);color:var(--dim);position:relative;min-height:54px}
nav svg{width:25px;height:25px}
nav button[aria-current=page]{color:var(--ice)}
nav button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ice);box-shadow:0 0 10px var(--ice)}
svg.ic{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

.panel{background:var(--panel);border:1px solid var(--line);clip-path:var(--cut);padding:14px}
.lab{font:12px var(--mono);letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:44px;padding:9px 14px;font:700 14px var(--display);letter-spacing:.04em;background:var(--ice);color:var(--ink);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);text-align:center}
.btn.alt{background:var(--line);color:var(--text)}
.btn.hot{background:var(--flux);color:var(--ink)}
.btn.bad{background:none;color:var(--stop);box-shadow:inset 0 0 0 1px var(--stop)}
.btn[disabled]{background:var(--shell);color:var(--dim);cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns>.w{grid-column:1/-1}
.mt{font-family:var(--mono);color:var(--dim);font-size:13px}

/* Info card */
.card{position:relative;background:var(--panel);border:1px solid var(--ice);clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);padding:14px}
.card::after{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(transparent,color-mix(in srgb,var(--ice) 14%,transparent),transparent);animation:cardscan 5s linear infinite;pointer-events:none}
@keyframes cardscan{to{top:110%}}
.id{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.sig{width:96px;height:96px;background:var(--ink);border:1px solid var(--line);padding:8px}
.sig svg{display:block;width:100%;height:100%}
.sig{display:block;overflow:hidden}
.sig.ph{padding:0}
.sig img{width:100%;height:100%;object-fit:cover;display:block}
.card .name,.card .bio,.card .facts{text-shadow:0 1px 5px var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:grid;gap:4px;font:12px var(--mono);color:var(--dim);text-align:center;cursor:pointer;min-width:0}
.tile>span:first-of-type{display:grid;place-items:center;aspect-ratio:1;border:1px solid var(--line);background-size:cover;background-position:center;font-size:24px;color:var(--ice)}
.tile[aria-pressed=true]{color:var(--text)}
.tile[aria-pressed=true]>span:first-of-type{border:2px solid var(--ice);box-shadow:0 0 10px var(--ice)}
.swatch{border-radius:50%;width:70%;height:70%;display:block}
.vh{position:absolute;opacity:0;width:1px;height:1px}
/* Animated frames (cards and style tiles) */
.frm{position:relative;overflow:hidden}
.frm::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
.fr-classic::before{content:none}
.card.fr-none{border-color:transparent}.fr-none::before{content:none}
.fr-pulse::before{box-shadow:inset 0 0 0 2px var(--ice),inset 0 0 22px color-mix(in srgb,var(--ice) 70%,transparent);animation:frPulse 1.8s ease-in-out infinite alternate}
@keyframes frPulse{from{opacity:.3}to{opacity:1}}
.fr-rainbow::before{padding:3px;background:conic-gradient(#ff4fb0,#ffb347,#c6ff3d,#3dffd8,#5da2ff,#b98cff,#ff4fb0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:frHue 3s linear infinite}
@keyframes frHue{to{filter:hue-rotate(360deg)}}
.fr-trace::before{background:linear-gradient(90deg,var(--ice) 50%,transparent 0) 0 0/18px 2px repeat-x,linear-gradient(90deg,var(--flux) 50%,transparent 0) 0 100%/18px 2px repeat-x,linear-gradient(0deg,var(--flux) 50%,transparent 0) 0 0/2px 18px repeat-y,linear-gradient(0deg,var(--ice) 50%,transparent 0) 100% 0/2px 18px repeat-y;animation:frTrace .9s linear infinite}
@keyframes frTrace{to{background-position:18px 0,-18px 100%,0 -18px,100% 18px}}
.fr-corners::before{inset:6px;--k:linear-gradient(var(--flux),var(--flux));background:var(--k) 0 0/24px 3px,var(--k) 0 0/3px 24px,var(--k) 100% 0/24px 3px,var(--k) 100% 0/3px 24px,var(--k) 0 100%/24px 3px,var(--k) 0 100%/3px 24px,var(--k) 100% 100%/24px 3px,var(--k) 100% 100%/3px 24px;background-repeat:no-repeat;animation:frCorner 1.6s ease-in-out infinite alternate}
@keyframes frCorner{from{inset:12px;opacity:.55}to{inset:4px;opacity:1}}
.fr-glitch::before{box-shadow:inset 3px 0 0 var(--flux),inset -3px 0 0 var(--ice),inset 0 2px 0 var(--ice),inset 0 -2px 0 var(--flux);animation:frGlitch 2.4s steps(1) infinite}
@keyframes frGlitch{0%,100%{transform:none;opacity:1}8%{transform:translate(3px,-1px)}10%{transform:translate(-3px,1px);opacity:.55}12%{transform:none;opacity:1}55%{transform:translate(-2px,0)}57%{transform:none}}
.fr-fire::before{box-shadow:inset 0 0 0 2px #ffb347,inset 0 -18px 30px -6px #ff5a1f,inset 0 0 26px rgba(255,122,46,.55);animation:frFire .35s ease-in-out infinite alternate}
@keyframes frFire{from{opacity:.7}to{opacity:1}}
.fr-double::before{inset:5px;border:1px solid var(--flux);animation:frDouble 3s ease-in-out infinite}
@keyframes frDouble{50%{inset:9px;opacity:.5}}
.fr-holo::before{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.24) 50%,transparent 65%) 0 0/300% 100% no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);animation:frHolo 3.2s linear infinite}
@keyframes frHolo{from{background-position:120% 0}to{background-position:-120% 0}}
.fr-orbit::before{inset:0;background:radial-gradient(circle,var(--flux) 0 3px,transparent 4px) 0 0/10px 10px no-repeat;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ice) 60%,transparent);animation:frOrbit 3s linear infinite}
@keyframes frOrbit{0%{background-position:0 0}25%{background-position:100% 0}50%{background-position:100% 100%}75%{background-position:0 100%}100%{background-position:0 0}}
/* Name effects */
.card .name.nm-glow{text-shadow:0 0 8px var(--ice),0 0 18px var(--ice)}
.card .name.nm-grad{background:linear-gradient(90deg,var(--ice),var(--flux));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.card .name.nm-flicker{text-shadow:0 0 10px var(--ice);animation:nmFlick 3s steps(1) infinite}
@keyframes nmFlick{0%,100%{opacity:1}42%{opacity:.4}44%{opacity:1}46%{opacity:.6}48%{opacity:1}}
.card .name.nm-glitch{animation:nmGlitch 2.2s steps(1) infinite}
@keyframes nmGlitch{0%,100%{text-shadow:0 1px 5px var(--ink)}10%{text-shadow:2px 0 var(--flux),-2px 0 var(--ice)}12%{text-shadow:-2px 0 var(--flux),2px 0 var(--ice)}14%{text-shadow:0 1px 5px var(--ink)}60%{text-shadow:1px 0 var(--flux)}62%{text-shadow:0 1px 5px var(--ink)}}
.card .name.nm-chrome{background:linear-gradient(180deg,#fff,#b8c4dc 48%,#5a6684 52%,#e8eefc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.nmchips button{font:700 15px var(--display)}
label:focus-within{outline:2px solid var(--ice);outline-offset:2px}
label.btn{cursor:pointer}
#sheet.still{animation:none}
.name{font:700 24px/1.1 var(--display);overflow-wrap:anywhere}
.namerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.moodb{display:inline-flex;align-items:center;min-height:32px}
.bubble{width:20px;height:20px;border-radius:50%;background:var(--m);box-shadow:0 0 6px var(--m),0 0 18px var(--m);animation:bub 2s ease-in-out infinite;display:block}
.bubble.s{width:13px;height:13px;flex:none}
@keyframes bub{50%{transform:scale(.8);box-shadow:0 0 3px var(--m),0 0 26px var(--m)}}
.moodt{color:var(--m);font:13px var(--mono);margin-top:3px}
.bio{margin-top:12px}
.facts{margin-top:12px;display:grid;gap:6px;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.facts li::before{content:"";width:7px;height:7px;background:var(--flux);transform:rotate(45deg) translateY(-1px)}
.meter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.big{font:700 54px/1 var(--display);color:var(--ice);font-variant-numeric:tabular-nums;text-shadow:0 0 18px color-mix(in srgb,var(--ice) 60%,transparent)}
.seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:6px}
.seg i{height:14px;background:var(--shell);transform:skewX(-14deg)}
.seg i.on{background:var(--ice);box-shadow:0 0 8px var(--ice)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{aspect-ratio:1;background:var(--shell);border:1px dashed var(--line);display:grid;place-items:center;color:var(--dim);font:12px var(--mono);padding:4px;max-width:100%}
.slot.fill{border-style:solid}

/* Badge art */
.bd{display:block;width:100%;height:100%;overflow:visible}
.bd .fr{stroke-linejoin:round}
.bd .bev{fill:none;stroke:hsl(var(--h) 100% 75% / .4);stroke-width:.7}
.bd .tr{fill:none;stroke:hsl(var(--a) 100% 72% / .6);stroke-width:.7}
.bd .nd{fill:hsl(var(--a) 100% 78%)}
.bd .riv{fill:hsl(var(--h) 60% 80%);stroke:hsl(var(--h) 80% 22%);stroke-width:.4}
.bd .tk{fill:none;stroke:hsl(var(--h) 100% 75% / .6);stroke-dasharray:.6 2.1;stroke-width:2.2}
.bd .mic{font-family:var(--mono);font-size:3.3px;letter-spacing:.2px;fill:hsl(var(--h) 100% 82%)}
.bd .gha{fill:none;stroke:#fff;stroke-opacity:.4;stroke-width:1.1;stroke-linecap:round}
.bd .glow{stroke-width:7.5;opacity:.24}
.bd .sheen{fill:#fff;opacity:.16}
.bd .fx{fill:none;stroke:hsl(var(--h) 100% 72%);stroke-width:1.8;transform-origin:50px 50px}
.bd .gl{fill:none;stroke:hsl(var(--h) 100% 84%);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform-origin:50px 50px}
.bd .dot{fill:hsl(var(--h) 100% 80%);stroke:none}
.bd .wed{fill:hsl(var(--h) 100% 70% / .3);stroke:none;transform-origin:50px 50px}
.bd .ch{stroke:#ff4fb0;opacity:.6}
.bd *{animation-play-state:paused}
.live .bd *,.bd.live *{animation-play-state:running}
.bd.lock{filter:grayscale(1) brightness(.55)}
.fa-items{animation:faItems 2.6s ease-in-out infinite alternate}
.fa-parts{animation:faParts 1.7s steps(1) infinite}
.fa-pcs{animation:faPcs 3.2s ease-in-out infinite}
.fa-drugs{animation:faDrugs 3.4s linear infinite}
.fa-pets{animation:faPets 1.15s ease-in-out infinite}
.fa-wardrobe{animation:faWardrobe 2.8s ease-in-out infinite}
.f-spot{fill:#fff;opacity:.16;transform-origin:50px 20px;animation:fSpot 3.4s ease-in-out infinite alternate}
.f-stitch{stroke:#fff;stroke-width:1.300;stroke-dasharray:3 4;animation:flow 3s linear infinite,ghue 4s linear infinite}
.f-hook{fill:none;stroke:#e8eefc;stroke-width:1.500;stroke-linecap:round}
.fa-vehicles{animation:faVehicles 1.6s ease-in-out infinite}
.f-spin3d{animation:fSpin3d 3.6s steps(12) infinite}
.f-road{stroke:#ffd36a;stroke-width:1.600;stroke-dasharray:6 7;animation:fRoad .5s linear infinite}
.f-under{animation:fUnder 1.4s ease-in-out infinite alternate}
.f-tach{stroke:#ff5a4a;stroke-width:2.200;stroke-dasharray:100;animation:fTach 2.2s cubic-bezier(.3,.1,.3,1) infinite}
.f-beam{fill:#fff6c8;opacity:0;animation:fBeam 2.2s steps(1) infinite}
.fa-weapons{animation:faWeapons 2s cubic-bezier(.7,0,.2,1) infinite}
.f-slash{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:34 100;animation:fSlash 2s cubic-bezier(.7,0,.2,1) infinite backwards}
.f-lock{fill:none;stroke:#ff5a4a;stroke-width:1.700;stroke-linecap:square;transform-origin:50px 50px;animation:fLock 2s ease-in-out infinite}
.f-hit{fill:#ffd18a;transform-origin:50px 50px;animation:fHit 2s ease-out infinite backwards}
.fe{fill:none;stroke-linecap:round;transform-origin:50px 50px}
.f-ember{animation:flow 2.4s linear infinite;stroke:#ffb347;stroke-width:1.700}
.f-ember2{animation:flow 3.6s linear infinite reverse;stroke:#ff4fb0;stroke-width:.9}
.f-holo{fill:#fff;opacity:.3;animation:fHolo 2.8s ease-in-out infinite}
.f-glint{fill:#fff;transform-box:fill-box;transform-origin:center;animation:fGlint 1.8s ease-in-out infinite}
.f-zap{stroke:#a9f4ff;stroke-width:1.500;animation:fZap 1.2s steps(1) infinite}
.f-scan{fill:#7ceaff;opacity:.55;animation:fScan 1.9s linear infinite}
.f-load{stroke:#3dff9a;stroke-width:2;stroke-dasharray:100;animation:fLoad 3.2s ease-in-out infinite}
.f-led{animation:gbl 1s steps(2) infinite}
.f-ring{stroke-width:2.200;animation:fRing 2.1s ease-out infinite}
.f-heart{fill:#ff6fb4}
.f-mote{fill:#ffd18a;animation:gsp 2.2s ease-out infinite}
@keyframes faItems{from{transform:translateY(-2.500px) scale(.97)}to{transform:translateY(2.500px) scale(1.04)}}
@keyframes faParts{0%,62%,70%,100%{transform:none;opacity:1}64%{transform:translate(-1px,.6px);opacity:.65}67%{transform:translate(1.200px,-.6px);opacity:1}}
@keyframes faPcs{0%,100%{opacity:.82}12%,88%{opacity:1}}
@keyframes faDrugs{0%{filter:hue-rotate(0deg);transform:rotate(-5deg) scale(.95)}50%{filter:hue-rotate(180deg);transform:rotate(5deg) scale(1.08)}100%{filter:hue-rotate(360deg);transform:rotate(-5deg) scale(.95)}}
@keyframes faPets{0%,100%{transform:translateY(1.500px) scale(1.05,.94)}50%{transform:translateY(-3px) scale(.96,1.05)}}
@keyframes faWeapons{0%,100%{transform:rotate(-13deg)}42%{transform:rotate(-20deg)}52%{transform:rotate(15deg) scale(1.08)}70%{transform:rotate(9deg)}}
@keyframes fSlash{0%,42%{stroke-dashoffset:34;opacity:0}46%{opacity:.95}62%{stroke-dashoffset:-100;opacity:.9}66%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes fLock{0%,100%{transform:rotate(45deg) scale(1.1);opacity:.55}50%{transform:rotate(45deg) scale(.94);opacity:1}54%{transform:rotate(45deg) scale(1.02);stroke:#fff}}
@keyframes fHit{0%,50%{transform:translate(0,0) scale(0);opacity:0}54%{transform:translate(0,0) scale(1);opacity:1}82%,100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@keyframes faVehicles{0%,100%{transform:translateY(-1.800px)}50%{transform:translateY(1.800px)}}
@keyframes fSpin3d{to{transform:translateX(-504px)}}
@keyframes fRoad{to{stroke-dashoffset:-13}}
@keyframes fUnder{from{opacity:.25}to{opacity:.7}}
@keyframes fTach{0%{stroke-dashoffset:100}55%{stroke-dashoffset:38}70%{stroke-dashoffset:48}100%{stroke-dashoffset:100}}
@keyframes fBeam{0%,48%,66%,100%{opacity:0}50%,64%{opacity:.85}}
@keyframes faWardrobe{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.03)}}
@keyframes fSpot{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes fHolo{0%{transform:translateX(-46px) skewX(-20deg)}70%,100%{transform:translateX(50px) skewX(-20deg)}}
@keyframes fGlint{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes fZap{0%,28%{opacity:1}30%,100%{opacity:0}}
@keyframes fScan{from{transform:translateY(-27px)}to{transform:translateY(27px)}}
@keyframes fLoad{from{stroke-dashoffset:100}80%,to{stroke-dashoffset:0}}
@keyframes fRing{from{transform:scale(.25);opacity:.9}to{transform:scale(1);opacity:0}}
.bd .f-ember,.bd .f-ember2{fill:none}
.a-rip2,.f-ring,.f-mote,.f-glint,.f-zap,.g-spark{animation-fill-mode:backwards!important}
.a-flow{animation:flow 1.6s linear infinite}
.sheen{animation:sheen 4.8s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes sheen{0%,35%{transform:translateX(-50px)}75%,100%{transform:translateX(150px)}}
.a-spin{animation:spin 7s linear infinite}.a-rev{animation:spin 5s linear infinite reverse}.a-fast{animation:spin 2.6s linear infinite}
.a-step{animation:spin 6s steps(12) infinite}
.a-trace{animation:trace 2.8s linear infinite}
.a-rip{animation:rip 2.6s ease-out infinite}.a-rip2{animation:rip 2.6s 1.3s ease-out infinite}
.a-rock{animation:rock 2.2s ease-in-out infinite alternate}
.a-cor{animation:cor 1.5s ease-in-out infinite alternate}
.g-float{animation:gfloat 2.4s ease-in-out infinite alternate}
.g-breathe{animation:gbr 1.9s ease-in-out infinite alternate}
.g-flick{animation:gfl 3s steps(1) infinite}
.g-glitch{animation:ggl 2.2s steps(1) infinite}
.g-tilt{animation:gti 2.6s ease-in-out infinite alternate}
.g-scan{animation:gsc 2s linear infinite}
.g-blink{animation:gbl 1.2s steps(2) infinite}.g-blink.d2{animation-delay:.3s}.g-blink.d3{animation-delay:.6s}
.g-chroma{animation:gch 1.3s ease-in-out infinite alternate}
.g-spark{animation:gsp 2s ease-out infinite}.g-spark.d2{animation-delay:.7s}.g-spark.d3{animation-delay:1.3s}
.g-hue{animation:ghue 4s linear infinite}
.t-holo{animation:ghue 3s linear infinite}.t-pulse{animation:tpulse 1.8s ease-in-out infinite}@keyframes tpulse{50%{opacity:.35}}.t-run{animation:flow 1.2s linear infinite}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.sw button{aspect-ratio:1;border:1px solid var(--line);display:grid;place-items:center}.sw button[aria-pressed=true]{border-color:var(--ice);outline:2px solid var(--ice);outline-offset:1px}.sw span{width:62%;height:62%;display:block;border-radius:50%}

<script>

const $=s=>document.querySelector(s);

const MOOD={g:{c:"var(--go)",t:"Approachable",d:"Happy to meet and swap badges."},y:{c:"var(--warn)",t:"Cautious",d:"Maybe. Keep it short and read the room."},r:{c:"var(--stop)",t:"Not approachable",d:"Please leave me be. Requests are off."}};

const poly=(n,rot=-90,r=45)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return (50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1)}).join(" ");

const MOTION_A=["Spin ring","Twin arcs","Clock ticks","Edge trace","Ripple","Orbit","Double orbit","Radar","Rocking gates","Corner pulse"];

const arc=(a,b,r)=>{const p=d=>[50+r*Math.cos(d*Math.PI/180),50+r*Math.sin(d*Math.PI/180)].map(v=>v.toFixed(1)).join(" ");return `M${p(a)}A${r} ${r} 0 0 1 ${p(b)}`};
function primary(p,pts){switch(p){
 case 0:return `<circle class="fx a-spin" cx="50" cy="50" r="38" stroke-dasharray="4 6"/>`;

 case 2:return `<g class="fx a-step">${Array.from({length:12},(_,i)=>`<path d="M50 11v6" transform="rotate(${i*30} 50 50)"/>`).join("")}</g>`;
 case 3:return `<polygon class="fx a-trace" points="${pts}" pathLength="100" stroke-dasharray="18 82" stroke-width="3.5"/>`;

 case 5:return `<g class="fx a-spin"><circle class="dot" cx="50" cy="12" r="3.600"/></g>`;

 default:return `<g class="fx a-cor"><path d="M20 28v-8h8M72 20h8v8M80 72v8h-8M28 80h-8v-8"/></g>`;
}}
const SPK="M0-4 1-1 4 0 1 1 0 4-1 1-4 0-1-1Z", HRT="M0 3C-4 0-4-3-2-3-1-3 0-2 0-1 0-2 1-3 2-3 4-3 4 0 0 3Z";
function forgeFxIn(k){switch(k){
 case "items":return `<rect class="f-holo" x="44" y="20" width="9" height="60"/>`;

 case "wardrobe":return `<polygon class="f-spot" points="46,20 54,20 68,78 32,78"/><g class="fa-wardrobe" style="transform-origin:50px 50px"><path class="f-hook" d="M50 30v-3a2.800 2.800 0 1 0-2.800-2.800"/></g>`;
 case "weapons":return `<path class="f-slash" d="M28 66Q50 58 72 32" pathLength="100"/>`;

 default:return ""}}
function forgeFxOut(k,r){let o=`<circle class="fe f-ember" cx="50" cy="50" r="29.200" pathLength="100" stroke-dasharray="14 11"/><circle class="fe f-ember2" cx="50" cy="50" r="31" pathLength="100" stroke-dasharray="5 15"/>`;
 for(let i=0;i<=r;i++)o+=`<circle class="f-mote" style="animation-delay:${i*.45}s" cx="${36+i*9}" cy="${72-(i%2)*3}" r="1.100"/>`;

async function fcSend(id){const p=fcCur;if(!p||p.id!==id||!fc)return;const g=(p.games||[])[+$("#fq_g").value];if(!g)return;
 const mineG=(fc.games||[]).find(x=>x.g===g.g&&(g.g!=="other"||String(x.n).toLowerCase()===String(g.n).toLowerCase()))||(fc.games||[]).find(x=>x.g===g.g);
 const doc={a:myId,aName:myName().slice(0,18),b:id,bName:String(p.name).slice(0,18),p:[myId,id],game:fcGame(g).slice(0,40),plat:g.plat||"",aTag:mineG?String(mineG.tag).slice(0,24):"",bTag:String(g.tag).slice(0,24),note:($("#fq_note").value||"").trim().slice(0,80),status:"pending",ca:null,cb:null,winner:null,at:Date.now()};

 try{await c("hfcFights").add(doc);closeSheet();bump("fcreq");toast(`Fight request sent to ${p.name}.`)}

async function fcAnswer(v){const [id,st]=v.split("|");const f=fights.find(x=>x.id===id);if(!f||f.status!=="pending"||f.b!==myId||!["accepted","declined"].includes(st))return;
 try{await d("hfcFights/"+id).update({status:st,at2:Date.now()});toast(st==="accepted"?`Fight on. Find ${f.aName} as ${f.aTag||"their tag"}.`:"Request declined.")}catch(e){bad(e);toast("That didn't go through.")}}

async function fcClaim(v){const [id,who]=v.split("|");const f=fights.find(x=>x.id===id);if(!f||!["accepted","disputed"].includes(f.status))return;
 const o=fcOpp(f),win=who==="me"?myId:o.id,k=f.a===myId?"ca":"cb",other=f.a===myId?f.cb:f.ca;
 const status=!other?"accepted":other===win?"done":"disputed";const at2=Date.now();
 try{const b=DB.batch();b.update(d("hfcFights/"+id),{[k]:win,status,winner:status==="done"?win:null,at2});
  if(status==="done")b.set(d("hfcResults/"+id),{p:f.p,winner:win,game:f.game,at:at2});
  await b.commit();
