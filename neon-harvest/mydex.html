<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>MyDex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one phone-height field unit that opens like a book; every tab is a page turned from the spine. */
:root{
  color-scheme:dark;
  --th:230; --ink:hsl(var(--th) 56% 7%); --shell:hsl(var(--th) 57% 14%); --panel:hsl(var(--th) 55% 19%); --line:hsl(var(--th) 43% 35%);
  --ice:#7ceaff; --flux:#ff4fb0; --text:#eef2ff; --dim:hsl(var(--th) 42% 78%);
  --go:#3dff9a; --warn:#ffd83d; --stop:#ff4d5e;
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#view>*,#sheet>*{flex:none}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
h1,h2,h3,p{margin:0}
#stage{height:100%;max-width:460px;margin:0 auto;position:relative;overflow:hidden;background:var(--shell)}
#app{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;perspective:1400px}

.top{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--dim)}
.top b{font:700 17px var(--display);letter-spacing:.14em;color:var(--ice);margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--line);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ice)}
.chip.off i{background:var(--dim)}
.lockbtn{width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ice)}
.lockbtn svg{width:20px;height:20px}

#view{overflow-y:auto;overflow-x:hidden;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;transform-origin:left center;-webkit-overflow-scrolling:touch}
#view.turn{animation:turn .42s cubic-bezier(.2,.8,.25,1)}
@keyframes turn{from{transform:rotateY(62deg);opacity:.15;box-shadow:inset 90px 0 70px rgba(0,0,0,.7)}to{transform:none;opacity:1}}

nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--ink);padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
nav button{padding:9px 2px 6px;display:grid;justify-items:center;gap:2px;font:12px var(--mono);color:var(--dim);position:relative;min-height:54px}
nav svg{width:25px;height:25px}
nav button[aria-current=page]{color:var(--ice)}
nav button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ice);box-shadow:0 0 10px var(--ice)}
svg.ic{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

.panel{background:var(--panel);border:1px solid var(--line);clip-path:var(--cut);padding:14px}
.lab{font:12px var(--mono);letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:44px;padding:9px 14px;font:700 14px var(--display);letter-spacing:.04em;background:var(--ice);color:var(--ink);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);text-align:center}
.btn.alt{background:var(--line);color:var(--text)}
.btn.hot{background:var(--flux);color:var(--ink)}
.btn.bad{background:none;color:var(--stop);box-shadow:inset 0 0 0 1px var(--stop)}
.btn[disabled]{background:var(--shell);color:var(--dim);cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns>.w{grid-column:1/-1}
.mt{font-family:var(--mono);color:var(--dim);font-size:13px}

/* Info card */
.card{position:relative;background:var(--panel);border:1px solid var(--ice);clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);padding:14px}
.card::after{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(transparent,color-mix(in srgb,var(--ice) 14%,transparent),transparent);animation:cardscan 5s linear infinite;pointer-events:none}
@keyframes cardscan{to{top:110%}}
.id{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.sig{width:96px;height:96px;background:var(--ink);border:1px solid var(--line);padding:8px}
.sig svg{display:block;width:100%;height:100%}
.sig{display:block;overflow:hidden}
.sig.ph{padding:0}
.sig img{width:100%;height:100%;object-fit:cover;display:block}
.card .name,.card .bio,.card .facts{text-shadow:0 1px 5px var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:grid;gap:4px;font:12px var(--mono);color:var(--dim);text-align:center;cursor:pointer;min-width:0}
.tile>span:first-of-type{display:grid;place-items:center;aspect-ratio:1;border:1px solid var(--line);background-size:cover;background-position:center;font-size:24px;color:var(--ice)}
.tile[aria-pressed=true]{color:var(--text)}
.tile[aria-pressed=true]>span:first-of-type{border:2px solid var(--ice);box-shadow:0 0 10px var(--ice)}
.swatch{border-radius:50%;width:70%;height:70%;display:block}
.vh{position:absolute;opacity:0;width:1px;height:1px}
label:focus-within{outline:2px solid var(--ice);outline-offset:2px}
label.btn{cursor:pointer}
#sheet.still{animation:none}
.name{font:700 24px/1.1 var(--display);overflow-wrap:anywhere}
.namerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.moodb{display:inline-flex;align-items:center;min-height:32px}
.bubble{width:20px;height:20px;border-radius:50%;background:var(--m);box-shadow:0 0 6px var(--m),0 0 18px var(--m);animation:bub 2s ease-in-out infinite;display:block}
.bubble.s{width:13px;height:13px;flex:none}
@keyframes bub{50%{transform:scale(.8);box-shadow:0 0 3px var(--m),0 0 26px var(--m)}}
.moodt{color:var(--m);font:13px var(--mono);margin-top:3px}
.bio{margin-top:12px}
.facts{margin-top:12px;display:grid;gap:6px;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.facts li::before{content:"";width:7px;height:7px;background:var(--flux);transform:rotate(45deg) translateY(-1px)}
.meter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.big{font:700 54px/1 var(--display);color:var(--ice);font-variant-numeric:tabular-nums;text-shadow:0 0 18px color-mix(in srgb,var(--ice) 60%,transparent)}
.seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:6px}
.seg i{height:14px;background:var(--shell);transform:skewX(-14deg)}
.seg i.on{background:var(--ice);box-shadow:0 0 8px var(--ice)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{aspect-ratio:1;background:var(--shell);border:1px dashed var(--line);display:grid;place-items:center;color:var(--dim);font:12px var(--mono);padding:4px;max-width:100%}
.slot.fill{border-style:solid}

/* Badge art */
.bd{display:block;width:100%;height:100%;overflow:visible}
.bd .fr{stroke-linejoin:round}
.bd .bev{fill:none;stroke:hsl(var(--h) 100% 75% / .4);stroke-width:.7}
.bd .tr{fill:none;stroke:hsl(var(--a) 100% 72% / .6);stroke-width:.7}
.bd .nd{fill:hsl(var(--a) 100% 78%)}
.bd .riv{fill:hsl(var(--h) 60% 80%);stroke:hsl(var(--h) 80% 22%);stroke-width:.4}
.bd .tk{fill:none;stroke:hsl(var(--h) 100% 75% / .6);stroke-dasharray:.6 2.1;stroke-width:2.2}
.bd .mic{font-family:var(--mono);font-size:3.3px;letter-spacing:.2px;fill:hsl(var(--h) 100% 82%)}
.bd .gha{fill:none;stroke:#fff;stroke-opacity:.4;stroke-width:1.1;stroke-linecap:round}
.bd .glow{stroke-width:7.5;opacity:.24}
.bd .sheen{fill:#fff;opacity:.16}
.bd .fx{fill:none;stroke:hsl(var(--h) 100% 72%);stroke-width:1.8;transform-origin:50px 50px}
.bd .gl{fill:none;stroke:hsl(var(--h) 100% 84%);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform-origin:50px 50px}
.bd .dot{fill:hsl(var(--h) 100% 80%);stroke:none}
.bd .wed{fill:hsl(var(--h) 100% 70% / .3);stroke:none;transform-origin:50px 50px}
.bd .ch{stroke:#ff4fb0;opacity:.6}
.bd *{animation-play-state:paused}
.live .bd *,.bd.live *{animation-play-state:running}
.bd.lock{filter:grayscale(1) brightness(.55)}
.a-flow{animation:flow 1.6s linear infinite}
.sheen{animation:sheen 4.8s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes sheen{0%,35%{transform:translateX(-50px)}75%,100%{transform:translateX(150px)}}
.a-spin{animation:spin 7s linear infinite}.a-rev{animation:spin 5s linear infinite reverse}.a-fast{animation:spin 2.6s linear infinite}
.a-step{animation:spin 6s steps(12) infinite}
.a-trace{animation:trace 2.8s linear infinite}
.a-rip{animation:rip 2.6s ease-out infinite}.a-rip2{animation:rip 2.6s 1.3s ease-out infinite}
.a-rock{animation:rock 2.2s ease-in-out infinite alternate}
.a-cor{animation:cor 1.5s ease-in-out infinite alternate}
.g-float{animation:gfloat 2.4s ease-in-out infinite alternate}
.g-breathe{animation:gbr 1.9s ease-in-out infinite alternate}
.g-flick{animation:gfl 3s steps(1) infinite}
.g-glitch{animation:ggl 2.2s steps(1) infinite}
.g-tilt{animation:gti 2.6s ease-in-out infinite alternate}
.g-scan{animation:gsc 2s linear infinite}
.g-blink{animation:gbl 1.2s steps(2) infinite}.g-blink.d2{animation-delay:.3s}.g-blink.d3{animation-delay:.6s}
.g-chroma{animation:gch 1.3s ease-in-out infinite alternate}
.g-spark{animation:gsp 2s ease-out infinite}.g-spark.d2{animation-delay:.7s}.g-spark.d3{animation-delay:1.3s}
.g-hue{animation:ghue 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes trace{to{stroke-dashoffset:-100}}
@keyframes rip{from{transform:scale(.55);opacity:.95}to{transform:scale(1.05);opacity:0}}
@keyframes rock{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes cor{from{transform:scale(.88);opacity:.45}to{transform:scale(1);opacity:1}}
@keyframes gfloat{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@keyframes gbr{from{transform:scale(.88)}to{transform:scale(1.08)}}
@keyframes gfl{0%,40%,44%,70%,100%{opacity:1}42%,72%{opacity:.25}}
@keyframes ggl{0%,86%,100%{transform:none}88%{transform:translate(-3px,1px)}92%{transform:translate(3px,-1px)}96%{transform:translate(-1px,0)}}
@keyframes gti{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
@keyframes gsc{from{transform:translateY(-22px);opacity:0}15%,85%{opacity:1}to{transform:translateY(22px);opacity:0}}
@keyframes gbl{50%{opacity:.15}}
@keyframes gch{from{transform:translate(-2px,0)}to{transform:translate(2px,0)}}
@keyframes gsp{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
@keyframes ghue{to{filter:hue-rotate(360deg)}}

/* Radar */
.radar{position:relative;width:min(100%,290px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:1px solid var(--ice);background:repeating-radial-gradient(circle,transparent 0 16%,color-mix(in srgb,var(--ice) 20%,transparent) 16% 16.5%),var(--ink);overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,color-mix(in srgb,var(--ice) 45%,transparent),transparent 26%);animation:spin 3.2s linear infinite}
.blip{position:absolute;width:32px;height:32px;margin:-16px;display:grid;place-items:center}
.you{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;background:var(--ice);transform:rotate(45deg)}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;background:var(--panel);border:1px solid var(--line);min-height:54px}
.pl strong{font:700 16px var(--display)}
details summary{cursor:pointer;font:13px var(--mono);color:var(--dim);padding:8px 0;min-height:36px}

/* Vault */
.car{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>button{flex:0 0 46%;scroll-snap-align:center;padding:12px;opacity:.45;transition:opacity .2s,transform .2s;transform:scale(.8)}
.car>button.cur{opacity:1;transform:scale(1)}
.car>.sp{flex:0 0 27%}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid button{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);padding:6px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 11px;border:1px solid var(--line);font:13px var(--mono);color:var(--dim);min-height:36px}
.chips button[aria-pressed=true]{background:var(--ice);border-color:var(--ice);color:var(--ink)}
.rar{font:12px var(--mono);padding:2px 7px;border:1px solid currentColor;white-space:nowrap}

/* Goals */
.goal{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .ico{width:44px;height:44px}
.bar{height:5px;background:var(--shell);margin-top:5px}
.bar i{display:block;height:100%;background:var(--ice)}
.tick{font:13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}

/* Spots */
#map{display:block;width:100%;aspect-ratio:1;max-width:100%;background:var(--ink);border:1px solid var(--line);touch-action:manipulation}
#map.drop{cursor:crosshair;border-color:var(--flux)}
.pin{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:block}

/* Sheets and moments */
#scrim{position:absolute;inset:0;background:rgba(4,6,18,.72);z-index:30}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;z-index:31;background:var(--shell);border-top:2px solid var(--ice);padding-block:16px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:rise .24s ease-out;display:flex;flex-direction:column;gap:12px}
@keyframes rise{from{transform:translateY(40%)}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{font:700 20px var(--display);overflow-wrap:anywhere;min-width:0}
.x{width:40px;height:40px;font:20px var(--mono);color:var(--dim);flex:none}
label.f{display:grid;gap:4px}
input[type=text],input[type=number],textarea{width:100%;background:var(--ink);border:1px solid var(--line);padding:10px;font-size:16px}
textarea{resize:vertical;min-height:68px}
.err{color:var(--stop);font-size:14px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%;min-height:56px}
.opt[aria-pressed=true]{border-color:var(--ice)}
.preview{width:150px;height:150px;margin:0 auto}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pick button{aspect-ratio:1;border:1px solid var(--line);display:grid;place-items:center;max-width:100%;color:var(--text)}
.pick button svg{width:80%;height:80%}
.pick button[aria-pressed=true]{border-color:var(--ice);background:var(--panel)}
.wait{display:grid;justify-items:center;gap:12px;padding:26px 0;text-align:center}
.spin{width:54px;height:54px;border:3px solid var(--line);border-top-color:var(--ice);border-radius:50%;animation:spin .8s linear infinite}

#moment{position:absolute;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:12px;background:rgba(5,7,22,.93);padding:24px;text-align:center;width:100%}
#moment .art{display:flex;justify-content:center;gap:22px}
#moment .one{width:min(52vw,190px);height:min(52vw,190px);animation:forge .7s cubic-bezier(.2,1.5,.4,1)}
#moment .two .one{width:min(32vw,130px);height:min(32vw,130px)}
#moment .two .one:first-child{animation:crossL .9s ease-out}
#moment .two .one:last-child{animation:crossR .9s ease-out}
@keyframes forge{from{transform:scale(.1) rotate(-160deg);opacity:0}}
@keyframes crossL{from{transform:translateX(170px) scale(.6)}}
@keyframes crossR{from{transform:translateX(-170px) scale(.6)}}
#moment h2{font:700 26px var(--display);color:var(--ice);text-wrap:balance}
#toast{pointer-events:none;position:absolute;left:16px;right:16px;bottom:76px;z-index:60;background:var(--ink);border:1px solid var(--ice);padding:10px 12px;font-size:14px;text-align:center}

#offline{position:absolute;inset:0;z-index:90;background:var(--ink);display:grid;place-content:center;gap:8px;padding:30px;text-align:center}

/* Lock and book */
#boot{position:absolute;inset:0;z-index:70;perspective:1500px;overflow:hidden;background:var(--ink)}
#boot.open{background:transparent;pointer-events:none}
.leaf,.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden}
.leaf{background:linear-gradient(90deg,hsl(var(--th) 55% 28%),var(--panel) 30%,var(--shell));border-right:1px solid var(--ice)}
.leaf::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 22px,color-mix(in srgb,var(--ice) 9%,transparent) 22px 23px)}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding-block:44px 34px;padding-left:max(34px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:radial-gradient(circle at 50% 42%,hsl(var(--th) 55% 28%),var(--shell) 62%,var(--ink))}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,var(--ink),hsl(var(--th) 55% 28%));border-right:1px solid var(--ice)}
.cover::after{content:"";position:absolute;left:17px;width:2px;height:90px;top:-90px;background:var(--ice);box-shadow:0 0 14px var(--ice);animation:seam 2.8s linear infinite}
@keyframes seam{to{top:100%}}
#boot.open .cover{transition:transform 1.15s cubic-bezier(.55,.05,.3,1);transform:rotateY(-118deg)}
#boot.open .leaf{transition:transform .95s cubic-bezier(.5,.05,.3,1);transform:rotateY(-118deg)}
#boot.open .l1{transition-delay:.3s}#boot.open .l2{transition-delay:.42s}#boot.open .l3{transition-delay:.54s}
.cover,.leaf{transition:transform .8s cubic-bezier(.5,.05,.3,1)}
.wm{font:700 clamp(46px,15vw,66px)/1 var(--display);letter-spacing:.1em;color:var(--ice);text-shadow:0 0 22px color-mix(in srgb,var(--ice) 70%,transparent);position:relative}
.wmsub{font:13px var(--mono);letter-spacing:.14em;color:var(--dim);text-align:center}
#lockart{width:min(66vw,250px);height:min(66vw,250px);overflow:visible}
#lockart .r{fill:none;transform-origin:100px 112px}
.r1{stroke:var(--ice);stroke-width:5;stroke-dasharray:62 18;animation:spin 14s linear infinite}
.r2{stroke:var(--flux);stroke-width:3;stroke-dasharray:24 12;animation:spin 8s linear infinite reverse}
.r3{stroke:var(--ice);stroke-width:7;stroke-dasharray:4 9;animation:spin 20s steps(40) infinite}
#shackle{fill:none;stroke:var(--ice);stroke-width:9;stroke-linecap:square;transition:transform .45s .2s cubic-bezier(.3,1.7,.5,1)}
#core{transition:fill .3s;fill:#0b0f2a;stroke:var(--ice);stroke-width:3}
#key{fill:var(--ice);transform-origin:100px 112px;transition:transform .5s}
#bolts rect{fill:var(--flux);transition:transform .35s}
.unlocking .r1{animation-duration:.8s}.unlocking .r2{animation-duration:.5s}.unlocking .r3{animation-duration:1s}
.unlocked #shackle{transform:translateY(-22px)}
.unlocked #core{fill:var(--ice)}
.unlocked #key{transform:rotate(90deg);fill:var(--ink)}
.unlocked #bolts rect:first-child{transform:translateX(-26px)}
.unlocked #bolts rect:last-child{transform:translateX(26px)}
.signin{display:grid;gap:8px;width:min(100%,290px);justify-items:stretch;text-align:center;position:relative}

 const plate=`<polygon class="fr" points="${pts}" style="fill:url(#${k}p);stroke:url(#${k}m);stroke-width:${d.r>=3?3.2:2.5}"/>`;

 let detail="",top="";

   tr+=`<path class="tr${flow?" a-flow":""}" d="M${pol(28,a)}L${pol(r-4,a)}L${e}"${flow?' stroke-dasharray="2 6"':""}/><circle class="nd" r="1.050" cx="${e.split(" ")[0]}" cy="${e.split(" ")[1]}"/>`}
  const v=pts.split(" ");const st=v.length>10?(v.length>16?4:2):1;

  const code=String(hash(d.id||d.name)%1000).padStart(3,"0");
  detail=`<g clip-path="url(#${k}c)"><rect width="100" height="100" fill="url(#${k}h)" opacity=".5"/>${tr}</g>${riv}<circle class="tk" cx="50" cy="50" r="34.500"/><text class="mic" text-anchor="middle"><textPath href="#${k}t" startOffset="50%">${esc(String(d.name).toUpperCase())} · MX-${code}</textPath></text>`;

  top=`<path class="gha" d="M33 40A20 20 0 0 1 58 30"/>${pips}${crown}<g clip-path="url(#${k}c)"><g transform="rotate(24 50 50)"><rect class="sheen" x="-10" y="-30" width="16" height="160"/></g></g>`;
