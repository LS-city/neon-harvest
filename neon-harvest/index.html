<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NEON HARVEST: a social 2D cyberpunk world. Collect PC parts, build rigs, work shifts, duel, and fight in The Void.">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}html,body{height:100%}</style>
<title>NEON HARVEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed canvas world, HUD strips pinned top/bottom, DOM panels float over the canvas. Single dark neon look by choice. */
:root{
  --ink:#0b0716;        /* night sky / page */
  --panel:#150e26;      /* terminal panel */
  --line:#3a2a5c;       /* panel edges */
  --text:#e9e2ff;       /* readout */
  --dim:#9a8cc0;        /* secondary */
  --mag:#ff3fa8;        /* bar neon */
  --cyan:#38e8ff;       /* street neon */
  --amber:#ffb84a;      /* credits */
  --c-common:#a8b3c6; --c-uncommon:#43f0a4; --c-rare:#4aa8ff; --c-epic:#cf72ff;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-ui:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-ui);font-size:13px;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#game{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#world{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
.hud{position:absolute;left:0;right:0;display:flex;gap:8px;align-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud.top{top:0;padding-block:10px;justify-content:space-between;flex-wrap:wrap}
.hud > *{pointer-events:auto}
.brand{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;color:var(--mag);text-shadow:0 0 8px var(--mag)}
.brand small{color:var(--cyan);text-shadow:0 0 6px var(--cyan);font-size:10px;margin-left:6px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(21,14,38,.82);border:1px solid var(--line);padding:4px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-weight:600}
.pill.cr b{color:var(--amber)} .pill.ch b{color:var(--cyan)} .pill.on b{color:var(--c-uncommon)}
.btn{font-family:var(--f-ui);font-size:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--cyan);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.btn.hot{border-color:var(--mag);color:#fff;box-shadow:0 0 10px rgba(255,63,168,.35) inset}
.btn:disabled{opacity:.4;cursor:not-allowed}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));font-family:var(--f-display);font-size:12px;
  background:rgba(11,7,22,.85);border:1px solid var(--cyan);color:var(--cyan);padding:6px 12px;pointer-events:none;white-space:nowrap}
#chatbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:flex-end;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
#chatbar > *{pointer-events:auto}
#chatlog{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));width:min(340px,60vw);
  max-height:120px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;pointer-events:none;font-size:12px}
#chatlog .ln{background:rgba(11,7,22,.6);padding:1px 6px;width:fit-content;max-width:100%;overflow-wrap:anywhere;transition:opacity .6s}
#chatlog .ln.sysl{font-size:11px;opacity:.9}
canvas.dccsym{vertical-align:-3px;margin-right:4px;display:inline-block}
.asmbins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.asmbins .card{align-items:center;text-align:center;padding:6px}
#game.mobile .asmbins{grid-template-columns:repeat(5,1fr);gap:4px}
#game.mobile .asmbins .card{padding:4px;min-height:44px}
#game.mobile .asmbins .card .meta{display:none}
.dccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dccgrid .card{align-items:center;text-align:center}
#chatlog .who{color:var(--mag)} #chatlog .sys{color:var(--cyan)} #chatlog .x{color:#9a8cc0;margin-left:4px}
#chatlog.open{max-height:min(46vh,320px);width:min(380px,calc(100vw - 32px));pointer-events:auto;background:rgba(11,7,22,.94);border:1px solid var(--line);padding:6px;justify-content:flex-start;z-index:6}
#chatlog.open .ln{background:none;padding:1px 2px}
#chatlog .loghead{display:flex;gap:4px;align-items:center;flex:none;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
#chatlog .loghead .btn{padding:2px 8px;font-size:11px}
#chatlog .logbody{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0;flex:1}
#chatlog .logbody .t{color:#6f6494;font-size:10px;margin-right:4px}
#btnLog{flex:none;padding:6px 9px}
#btnMsg{position:relative}
#btnMsg .badge{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--mag);color:#fff;font-size:10px;line-height:17px;text-align:center}
.msglist{display:flex;flex-direction:column;gap:6px;max-height:min(46vh,380px);overflow-y:auto;padding:6px;border:1px solid var(--line);background:rgba(7,4,15,.6)}
.msg{max-width:78%;padding:5px 9px;background:#1d1433;border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#2a0f3d;border-color:var(--mag)}
.msg .mw{font-size:10px;color:var(--cyan);margin-bottom:2px}
.msg.sysm{align-self:center;background:none;border:none;color:#9a8cc0;font-size:11px;text-align:center}
.chatrow{display:flex;gap:6px;margin-top:8px}.chatrow input{flex:1;min-width:0}
.chip{display:inline-block;padding:2px 8px;border:1px solid var(--line);font-size:11px;margin:2px 4px 2px 0}
.pl-pick{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto}
.pl-pick label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:#43f0a4;display:inline-block;flex:none}
.rbook details{border:1px solid var(--line);background:rgba(21,14,38,.6);margin-bottom:6px}
.rbook summary{display:flex;gap:10px;align-items:center;padding:6px 8px;cursor:pointer;list-style:none}
.rbook summary::-webkit-details-marker{display:none}
.rbook summary::after{content:"▸";margin-left:auto;color:var(--cyan);transition:transform .15s}
.rbook details[open] summary::after{transform:rotate(90deg)}
.rbook .rb-body{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
.rbook .rb-need{border-top:1px dashed var(--line);padding-top:6px}
.rbook .rb-items{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.rbook .rb-items span{border:1px solid var(--line);padding:1px 6px;font-size:11px}
.rbook .rb-items span.own{border-color:#43f0a4}
.rbook .rb-mk{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
#chatin{flex:1;min-width:0;max-width:340px;font-family:var(--f-ui);font-size:13px;background:rgba(21,14,38,.9);color:var(--text);border:1px solid var(--line);padding:7px 9px}
.emotes{display:flex;gap:4px}
.emotes .btn{padding:6px 8px}
/* touch pad */
#pad{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));display:none;gap:10px;align-items:flex-end}
#pad .dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
#pad .k{background:rgba(21,14,38,.75);border:1px solid var(--line);color:var(--cyan);font-family:var(--f-display);display:grid;place-items:center;font-size:14px;touch-action:none}
#pad .act{width:58px;height:58px;border-radius:50%;border-color:var(--mag);color:var(--mag)}
@media (pointer:coarse){#pad{display:flex}}
/* panels */
#overlay{position:absolute;inset:0;background:rgba(5,3,12,.62);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 0 40px rgba(255,63,168,.18);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;min-width:0;min-height:0}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel h2{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.06em;color:var(--cyan);text-wrap:balance}
.panel .sub{color:var(--dim);font-size:12px;margin:2px 0 0}
.panel .body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;flex:1 1 auto;overscroll-behavior:contain}
.panel header{flex:none}
.panel .body > *{flex-shrink:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs .btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.guide h3{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}.guide ul{margin:0;padding-left:18px}.guide li{margin:4px 0;line-height:1.5;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{border:1px solid var(--line);background:#100a1d;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left;color:var(--text);font-family:var(--f-ui)}
.card:hover,.card.sel{border-color:var(--cyan)}
.card canvas{width:100%;aspect-ratio:1;max-width:100%;background:radial-gradient(circle at 50% 45%,#22163e,#0d0818 70%)}
.card .nm{font-size:11px;line-height:1.25;min-height:2.5em;overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.r-common{color:var(--c-common)} .r-uncommon{color:var(--c-uncommon)} .r-rare{color:var(--c-rare)} .r-epic{color:var(--c-epic)}
.card.r-epic{box-shadow:0 0 12px rgba(207,114,255,.18) inset}
.detail{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);padding:10px;flex-wrap:wrap}
.detail canvas{width:96px;height:96px;flex:none;background:radial-gradient(circle at 50% 45%,#22163e,#0d0818 70%)}
.detail .info{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{color:var(--dim);border:1px dashed var(--line);padding:18px;text-align:center}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
input.num,select{font-family:var(--f-ui);background:#0d0818;color:var(--text);border:1px solid var(--line);padding:6px 8px;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:6px 8px;min-width:0}
.li canvas{width:48px;height:48px;flex:none}
.li .grow{flex:1;min-width:0}
.li .grow div{overflow-wrap:anywhere}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;padding:1px 5px}
.upl{display:block;width:100%;max-width:480px;aspect-ratio:3/2;height:auto;margin:6px auto;background:#07040f;border:1px solid var(--line);touch-action:none;outline:none}
.upl:focus-visible{outline:2px solid var(--cyan)}
.upl-hud{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;letter-spacing:.04em}
.upl-hud strong{color:var(--cyan)}
.upl-msg{min-height:2.6em;text-align:center;margin:4px 0;font-size:12px;color:#e9e2ff}
.upl-pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,40px);gap:4px;justify-content:center;margin:4px auto}
.upl-pad [data-d=up]{grid-column:2;grid-row:1}.upl-pad [data-d=left]{grid-column:1;grid-row:2}.upl-pad [data-d=down]{grid-column:2;grid-row:2}.upl-pad [data-d=right]{grid-column:3;grid-row:2}
.upl-pad .btn{padding:0;font-size:16px;touch-action:none}
@media (pointer:fine){.upl-pad{display:none}}
.upl-levels{display:flex;flex-wrap:wrap;gap:6px}
.upl-levels .btn[aria-disabled=true]{opacity:.45}
.upl-levels .btn.done{border-color:#43f0a4}
.upl-h{margin:10px 0 6px;font-size:12px;letter-spacing:.08em;color:var(--cyan)}
.upl-info p{margin:6px 0;font-size:12px;color:#c9bff0}
#mini{width:100%;height:130px;background:#0d0818;border:1px solid var(--line)}
#toast{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,90vw)}
#invites{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(300px,80vw);z-index:5}
.icard{background:var(--panel);border:1px solid var(--mag);box-shadow:0 0 18px rgba(255,63,168,.25);padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,84px));gap:6px;justify-content:center}
.ttt .cell{aspect-ratio:1;max-width:100%;background:#0d0818;border:1px solid var(--line);color:var(--text);font-family:var(--f-display);font-size:34px;cursor:pointer}
.ttt .cell.x{color:var(--cyan);text-shadow:0 0 10px var(--cyan)} .ttt .cell.o{color:var(--mag);text-shadow:0 0 10px var(--mag)}
.ttt .cell:disabled{cursor:default;opacity:1}
.chess{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:min(100%,360px);aspect-ratio:1;max-width:100%;margin:0 auto;border:1px solid var(--line)}
.chess .sq{border:0;padding:0;background:#1a1230;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;font-variant-emoji:text;font-size:clamp(16px,5vw,28px);line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--text)}
.chess .sq.d{background:#2a1f48} .chess .sq.last{box-shadow:inset 0 0 0 2px rgba(255,184,74,.6)} .chess .sq.sel{box-shadow:inset 0 0 0 2px var(--cyan)}
.chess .sq.tgt{background-image:radial-gradient(circle,rgba(67,240,164,.55) 18%,transparent 20%)}
.chess .pw{color:var(--cyan);text-shadow:0 0 8px var(--cyan)} .chess .pb{color:var(--mag);text-shadow:0 0 8px var(--mag)}
.rps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rpsb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;min-width:0}
.rpsb .g{font-size:30px;color:var(--c-uncommon)} .rpsb .sub{font-size:10px;text-align:center}
.bigcode{font-family:var(--f-display);font-size:26px;letter-spacing:.12em;color:var(--amber);text-shadow:0 0 10px rgba(255,184,74,.5);text-align:center;padding:10px;border:1px dashed var(--amber);user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.bigcode.sm{font-size:14px;padding:2px 6px;text-align:left;border:0;display:inline-block}
.title{position:absolute;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(255,63,168,.22),transparent 60%),linear-gradient(180deg,rgba(11,7,22,.86),rgba(11,7,22,.97));}
.title::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.tcard{position:relative;z-index:1;width:min(440px,100%);background:rgba(21,14,38,.92);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 0 60px rgba(255,63,168,.25);padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tlogo{font-family:var(--f-display);font-size:clamp(26px,7vw,40px);letter-spacing:.06em;color:var(--mag);text-shadow:0 0 14px var(--mag),0 0 2px #fff;line-height:1}
.tsub{font-family:var(--f-display);font-size:10px;letter-spacing:.16em;color:var(--cyan)}
.th{margin:4px 0 0;font-family:var(--f-display);font-size:18px;color:var(--text);text-wrap:balance}
.tname{font-size:26px;color:var(--amber);text-shadow:0 0 10px rgba(255,184,74,.5);overflow-wrap:anywhere}
.twb{font-family:var(--f-display);font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:2px}
.tadmin{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;color:var(--c-uncommon);border:1px solid currentColor;padding:2px 8px}
.tprev{width:150px;height:150px;max-width:100%;background:radial-gradient(circle at 50% 62%,#2a1a48,transparent 70%)}
.tstats{justify-content:center}
.tacct{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)} .tdot{width:8px;height:8px;border-radius:50%;background:var(--c-uncommon);box-shadow:0 0 8px var(--c-uncommon)}
.tcol{flex-direction:column;align-items:stretch;width:100%;gap:8px} .tcol .btn{padding:10px 12px;font-size:13px} .tbig{font-family:var(--f-display);font-size:15px!important;letter-spacing:.06em}
.tsteps{text-align:left;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--text)}
.tcard p{margin:0;max-width:60ch}
.tspin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:tspin 1s linear infinite} @keyframes tspin{to{transform:rotate(360deg)}}
#online{font-family:var(--f-ui);font-size:13px;color:var(--text);cursor:pointer} #online:hover{border-color:var(--cyan)}
#hppill{--hp:100%;background:linear-gradient(90deg,rgba(67,240,164,.4) var(--hp),rgba(21,14,38,.82) var(--hp));font-weight:600;min-width:72px}
#hppill[data-low="1"]{background:linear-gradient(90deg,rgba(255,90,74,.55) var(--hp),rgba(21,14,38,.82) var(--hp))}
#combat{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:4}
#combat .btn{font-family:var(--f-display);font-size:13px;padding:12px 16px;touch-action:none}
#combat .atk{border-color:#ff5a4a;color:#fff;box-shadow:0 0 14px rgba(255,90,74,.45) inset}
@media (pointer:coarse){#combat{right:calc(max(16px,env(safe-area-inset-right,0px)) + 214px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
#deathov{position:absolute;inset:0;z-index:18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:radial-gradient(circle,rgba(120,0,20,.6),rgba(5,0,8,.94));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#deathov .dtitle{font-family:var(--f-display);font-size:clamp(44px,12vw,96px);color:#ff5a4a;text-shadow:3px 0 #38e8ff,-3px 0 #ff3fa8;animation:dglitch .25s steps(2) infinite}
@keyframes dglitch{50%{transform:translateX(3px) skewX(-6deg)}}
#deathov .dsub{font-size:16px;color:#e9e2ff} #deathov .dloss{color:#ffb84a;max-width:46ch}
#toast div{background:rgba(11,7,22,.92);border:1px solid var(--mag);padding:6px 12px;font-size:12px;text-align:center}
@media (max-width:520px){.brand small{display:none}.emotes{display:none}#chatlog{width:70vw}#chatlog .ln.sysl{display:none}#chatlog.open .ln.sysl{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===================== MOBILE (touch) LAYOUT: only applies when #game has .mobile ===================== */
#btnMenu{display:none}
#game.mobile{--top:calc(54px + env(safe-area-inset-top,0px));--cvh:min(86vw,54vh);background:#07040f}
#game.mobile #overlay{z-index:15}
#game.mobile button,#game.mobile .btn,#game.mobile .k{touch-action:manipulation}
#game.mobile input,#game.mobile select,#game.mobile textarea{font-size:16px!important}
#game.mobile .hud.top{padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));min-height:var(--top);flex-wrap:nowrap;background:linear-gradient(rgba(7,4,15,.95),rgba(7,4,15,.75));border-bottom:1px solid var(--line);z-index:5}
#game.mobile .brand{display:none}
#game.mobile .stats{flex-wrap:nowrap;width:100%;align-items:center;gap:5px;min-width:0}
#game.mobile .stats .pill{font-size:12px;padding:0 8px;height:40px;display:inline-flex;align-items:center;gap:4px;flex:none}
#game.mobile #btnAdmin,#game.mobile #btnTravel,#game.mobile #btnChar,#game.mobile #btnHelp,#game.mobile #btnSnd,#game.mobile #buffs,#game.mobile #trippill,#game.mobile #jobpill{display:none!important}
#game.mobile #hppill{max-width:34vw;overflow:hidden;text-overflow:ellipsis}
#game.mobile .mbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;font-size:20px;flex:none}
#game.mobile #btnBag{margin-left:auto}
#game.mobile #btnMsg .badge{top:-4px;right:-4px}
#game.mobile #toast{top:calc(var(--top) + 6px);width:min(360px,92vw)}
#game.mobile #toast div{font-size:12px;padding:6px 10px}
#game.mobile #toast div:nth-child(n+4){display:none}
#game.mobile #prompt{pointer-events:auto;cursor:pointer;font-size:13px;padding:10px 14px;min-height:44px;display:flex;align-items:center;gap:8px;border:1px solid var(--cyan);background:rgba(11,7,22,.94);box-shadow:0 0 14px rgba(56,232,255,.35);max-width:calc(100vw - 32px);text-align:left}
#game.mobile #prompt[hidden]{display:none}
#game.mobile #pad{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));justify-content:space-between;align-items:flex-end;pointer-events:none}
#game.mobile #pad > *{pointer-events:auto}
#game.mobile #pad .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:3px}
#game.mobile #pad .dpad span{pointer-events:none}
#game.mobile #pad .k{font-size:18px;border-radius:10px}
#game.mobile #pad .act{width:76px;height:76px;font-size:16px;border-width:2px}
#game.mobile #chatbar{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#game.mobile #chatbar .emotes{display:none}
#game.mobile #chatin{max-width:none;height:44px}
#game.mobile #btnLog{height:44px;min-width:52px}
#game.mobile #combat .btn{min-height:56px;min-width:76px;font-size:14px}
#game.mobile #chatlog{font-size:13px}
#game.mobile #chatlog.open{max-height:none}
/* portrait: world on top, a control deck underneath so thumbs never cover the game */
#game.mobile.portrait canvas#world{position:absolute;top:var(--top);left:0;width:100%;height:var(--cvh);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.6)}
#game.mobile.portrait #prompt{top:calc(var(--top) + var(--cvh) + 10px);bottom:auto}
#game.mobile.portrait #chatlog{top:calc(var(--top) + var(--cvh) + 64px);bottom:calc(64px + 176px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto;max-height:none;justify-content:flex-end;overflow:hidden}
#game.mobile.portrait #chatlog.open{top:calc(var(--top) + var(--cvh) + 10px);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6}
#game.mobile.portrait #pad{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
#game.mobile.portrait #combat{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(66px + 92px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:flex-end}
#game.mobile.portrait #invites{top:calc(var(--top) + var(--cvh) + 10px)}
/* landscape: full-screen world, controls in the corners, chat between them */
#game.mobile:not(.portrait) #pad{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#game.mobile:not(.portrait) #pad .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
#game.mobile:not(.portrait) #pad .act{width:68px;height:68px}
#game.mobile:not(.portrait) #chatbar{left:calc(max(14px,env(safe-area-inset-left,0px)) + 152px);right:calc(max(14px,env(safe-area-inset-right,0px)) + 84px);width:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#game.mobile:not(.portrait) #chatlog{top:calc(var(--top) + 6px);bottom:auto;left:max(12px,env(safe-area-inset-left,0px));width:min(320px,40vw)}
#game.mobile:not(.portrait) #chatlog.open{max-height:calc(100vh - var(--top) - 80px)}
#game.mobile:not(.portrait) #prompt{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
#game.mobile:not(.portrait) #combat{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px))}
/* windows become full-screen sheets with a big close button */
#game.mobile #overlay{padding:0;align-items:stretch;justify-content:stretch}
#game.mobile .panel{width:100%;max-width:none;height:100%;max-height:none;border:0;box-shadow:none}
#game.mobile .panel header{padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;background:var(--panel);z-index:2}
#game.mobile .panel header .btn{min-width:72px;min-height:44px;flex:none}
#game.mobile .panel .body{padding:12px max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#game.mobile .panel .btn{min-height:44px}
#game.mobile .panel .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
#game.mobile .panel .tabs::-webkit-scrollbar{display:none}
#game.mobile .panel .tabs .btn{flex:none;white-space:nowrap}
#game.mobile .panel .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
#game.mobile .panel .tabs{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:28px}
#game.mobile .panel .tabs.end{-webkit-mask-image:none;mask-image:none}
#game.mobile .wtop{position:sticky;top:-12px;z-index:1;background:var(--panel);margin:-12px -12px 0;padding:8px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);box-shadow:0 6px 12px -6px #000}
#game.mobile .wtop .detail{padding:6px;gap:10px;align-items:center;flex-wrap:nowrap}
#game.mobile .wtop .detail canvas{width:88px!important;height:88px!important}
#game.mobile .wtop .info{gap:4px;min-width:0;flex:1}
#game.mobile .wtop .info .sub{display:none}
#game.mobile .wtop .info .row{gap:6px;flex-wrap:wrap}
#game.mobile .wtop .info .row{flex-wrap:wrap}
#game.mobile .wtop .info .row .btn{padding:6px 8px;font-size:13px;min-height:44px;flex:1 1 auto;white-space:nowrap}
#game.mobile .wtop .info .row .btn.hot{flex:2 1 auto}
#game.mobile .wtop .info .r-epic{font-size:12px}
#game.mobile .wtop .info strong{font-size:14px}
#game.mobile .wgrid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
#game.mobile .wgrid .card{padding:6px;min-height:44px}
#game.mobile .wgrid .card canvas{width:100%!important;height:auto!important;aspect-ratio:1}
#game.mobile .wgrid .card .nm{font-size:12px;line-height:1.2}
#game.mobile .wgrid .card .meta{font-size:11px}
#game.mobile:not(.portrait) .wtop{flex-direction:row;align-items:center;gap:10px;padding:6px 12px}
#game.mobile:not(.portrait) .wtop .detail{flex:0 1 auto;max-width:52%;border:0;padding:0}
#game.mobile:not(.portrait) .wtop .tabs{flex:1 1 0;min-width:0}
#game.mobile:not(.portrait) .wtop .info strong,#game.mobile:not(.portrait) .wtop .info .r-epic{display:none}
#game.mobile:not(.portrait) .wtop .info .row{flex-wrap:nowrap}
#game.mobile:not(.portrait) .wtop .detail canvas{width:52px!important;height:52px!important}
#game.mobile:not(.portrait) .panel header{padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:4px}
#game.mobile:not(.portrait) .wtop .info .row .btn{min-height:36px;padding:4px 10px}
#game.mobile .panel .li{flex-wrap:wrap}
#game.mobile .panel .li > .row{flex-wrap:wrap}
.mmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mmenu .btn{min-height:56px;display:flex;align-items:center;gap:10px;justify-content:flex-start;font-size:14px;text-align:left}
.mmenu .btn .ic{font-size:20px;width:26px;text-align:center}
.mmenu .wide{grid-column:1/-1}
.memotes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memotes .btn{min-height:52px}
/* title/sign-in screens: scroll instead of cutting off on short screens */
.title{place-items:start center}
.tcard{margin-block:auto}

<body>
<div id="game">
  <canvas id="world" aria-label="NEON HARVEST city view"></canvas>
  <div class="hud top">
    <div class="brand">NEON HARVEST <small>// SECTOR 9</small></div>
    <div class="stats">
      <span class="pill cr">₵ <b id="credits">0</b></span>
      <span class="pill ch">CHIPS <b id="chips">0</b></span>
      <span class="pill" id="hppill" hidden></span>
      <span class="pill" id="jobpill" hidden></span>
      <span class="pill" id="buffs" hidden></span>
      <span class="pill" id="trippill" hidden></span>
      <button class="pill on" id="online" type="button" title="Players online">ONLINE <b>1</b></button>
      <button class="btn" id="btnChar" type="button">Character [C]</button>
      <button class="btn" id="btnBag" type="button">Stash [I]</button>
      <button class="btn" id="btnMsg" type="button">Messages [M]</button>
      <button class="btn" id="btnTravel" type="button" title="Fast travel anywhere (T)">Fast Travel [T]</button>
      <button class="btn" id="btnHelp" type="button">How to Play [H]</button>
      <button class="btn" id="btnSnd" type="button" aria-pressed="false">Sound off</button>
      <button class="btn hot" id="btnAdmin" type="button" hidden>Admin</button>
      <button class="btn mbtn" id="btnMenu" type="button" aria-label="Menu">☰</button>
    </div>
  </div>
  <div id="toast" aria-live="polite"></div>
  <div id="invites" aria-live="polite"></div>
  <div id="chatlog" aria-live="polite"></div>
  <div id="prompt" hidden></div>
  <div id="pad">
    <div class="dpad">

  <div id="chatbar">

    <input id="chatin" maxlength="80" placeholder="Say something… (Enter)" autocomplete="off" aria-label="Chat message">
    <div class="emotes">
      <button class="btn" type="button" data-emote="wave">Wave</button>
      <button class="btn" type="button" data-emote="dance">Dance</button>
      <button class="btn" type="button" data-emote="cheer">Cheer</button>
      <button class="btn" type="button" data-emote="pose">Pose</button>
    </div>
  </div>
  <div id="combat" hidden><button class="btn" id="btnBlock" type="button">Block [G]</button><button class="btn atk" id="btnAtk" type="button">Attack [F]</button></div>
  <div id="deathov" hidden></div>
  <div id="overlay" hidden></div>
  <div id="title" class="title" hidden></div>
</div>

let loopErr=0;
function step(now){
  try{ stepInner(now); }catch(e){ if(loopErr++<3){ console.error(e); chatLine(null,"Something glitched, but the game kept running. ("+String(e&&e.message||e).slice(0,80)+")","sys"); } }
  requestAnimationFrame(step);
}
function stepInner(now){
  dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  const sc=SCENES[me.scene];
  // input
  let ix=0,iy=0; if(keys.a||keys.arrowleft||keys.padleft) ix--; if(keys.d||keys.arrowright||keys.padright) ix++; if(keys.w||keys.arrowup||keys.padup) iy--; if(keys.s||keys.arrowdown||keys.paddown) iy++;
  if(me.dead){ ix=0; iy=0; target=null; }
  if(ix||iy) target=null;
  if(target){ const dx=target.x-me.x, dy=target.y-me.y; const d=Math.hypot(dx,dy); if(d<6){ const u=target.use; target=null; if(u&&$("#overlay").hidden){ beep(880,.05); safeAct(u); } } else { ix=dx/d; iy=dy/d; } }
  let sp=buffOn("speed")?195:150; if(me.blocking||(me.slowUntil||0)>T) sp*=.5; if(me.dead) sp=0; me.moving=!!(ix||iy)&&$("#overlay").hidden;
  if(me.seat!=null&&me.moving){ me.seat=null; pushPresence(true); }
  if(me.seat!=null){ me.moving=false; me.x=SEATS[me.seat].x; me.y=SEATS[me.seat].y; }
  if(me.homeSit&&(me.moving||(me.scene!=="home"&&me.scene!=="vip"))){ me.homeSit=null; pushPresence(true); }
  if(me.homeSit){ me.moving=false; me.x=me.homeSit.x; me.y=272; }
  if(me.trainUntil>T&&T-(me.lastPunch||0)>.32){ me.lastPunch=T; me.emote={e:"atk",t:T}; beep(110+Math.random()*40,.04,"square",.03); }
  if(me.moving){ const n=Math.hypot(ix,iy)||1; me.x=clamp(me.x+ix/n*sp*dt,30,sc.w-30); me.y=clamp(me.y+iy/n*sp*.6*dt,LANE.top,LANE.bot); if(ix) me.dir=ix>0?1:-1; me.phase+=dt*7; }
  camX=clamp(me.x-VW/2,0,Math.max(0,sc.w-VW));
  // hotspot proximity
  nearHot=me.scene==="home"?(hotspots("home").filter(h=>Math.abs(h.x-me.x)<h.hw).sort((a,b)=>Math.abs(a.x-me.x)-Math.abs(b.x-me.x))[0]||null):hotspots(me.scene).find(h=>Math.abs(h.x-me.x)<h.hw)||null;
  const pr=$("#prompt"); if(nearHot&&$("#overlay").hidden){ const txt=(MOBILE?"▶ Tap: ":"[E] ")+nearHot.label; if(pr.textContent!==txt) pr.textContent=txt; if(pr.hidden) pr.hidden=false; } else if(!pr.hidden) pr.hidden=true;
  // peers smoothing
  for(const p of peers.values()){ const k=Math.min(1,dt*8); const ox=p.dx; p.dx+=(p.x-p.dx)*k; p.dy+=(p.y-p.dy)*k; p.moving=Math.abs(p.dx-ox)>.3; if(p.moving) p.phase+=dt*7; }
  // npcs
  for(const n of (npcs[me.scene]||[])){ if(n.vx){ n.x+=n.vx*dt; if(n.x>n.max||n.x<n.min){ n.vx*=-1; } n.dir=n.vx>0?1:-1; n.phase=(n.phase||0)+dt*6; } }
  tickCustomers(); tickJobs(); tickCb(); tickBb(); tickClub(); tickVoid();
  pushPresence(false);
  if(cv.height>4){ render(); screenFx(); }
  tickItemCans(T); tickLookCans(T);
}
function render(){
  ctx.setTransform(scale,0,0,scale,-camX*scale,0);
  if(me.scene==="street") drawStreet(T); else if(me.scene==="bar") drawBar(T); else if(me.scene==="byte") drawByte(T); else if(me.scene==="grid") drawGrid(T); else if(me.scene==="smacked") drawSmacked(T); else if(me.scene==="cyberbuys") drawCbStore(T); else if(me.scene==="club") drawClub(T); else if(me.scene==="void") drawVoid(T); else if(me.scene==="linx") drawLinx(T); else if(me.scene==="vip") drawVip(T); else if(me.scene==="assembly") drawAssembly(T); else drawHome(T); if(me.scene==="bar"||me.scene==="club") drawVipDoors(T);
  // hotspot marker
  if(nearHot){ ctx.fillStyle="#38e8ff"; ctx.globalAlpha=.6+.4*Math.sin(T*6); ctx.beginPath(); ctx.moveTo(nearHot.x-6,250); ctx.lineTo(nearHot.x+6,250); ctx.lineTo(nearHot.x,258); ctx.fill(); ctx.globalAlpha=1; }

  for(const p of peers.values()) if(p.s===me.scene&&(p.home||null)===curHomeKey()) ents.push({x:p.dx,y:p.dy,o:{dir:p.dir,phase:p.phase,moving:p.moving,look:p.look,dcc:dccSym(p.by),name:(p.staff?"★ ":"")+nameOf(p.by),say:p.say?{text:p.say.text,t:T-(Date.now()-p.say.at)/1000}:null,emote:p.emote?{e:p.emote.e,it:p.emote.it,t:T-(Date.now()-p.emote.at)/1000}:null,fx:p.fx,sit:(p.s==="club"&&p.seat!=null)||((p.s==="home"||p.s==="vip")&&p.hs),hp:p.s==="void"?p.hp:null,block:p.blk,dead:p.dead,hurt:p.hurtT}});
  if(me.scene==="club") for(const c of patrons) ents.push({x:c.x,y:c.y,cust:c,o:{dir:c.dir,phase:c.phase,moving:c.moving,look:c.look,sit:c.sat,name:c.arrived&&!c.leaving?`Seat ${c.seat+1}`:"",say:c.arrived&&!c.leaving&&!c.served?{text:`${BY[c.want].n}, please`,t:T}:null,emote:c.useT&&T-c.useT<3?{e:"use",t:c.useT,it:c.want}:null,fx:(c.fxUntil||0)>Date.now()?TRIPS[c.want].fx:null}});
  if(me.scene==="byte") for(const c of bbCustomers) ents.push({x:c.x,y:c.y,cust:c,o:{dir:c.dir,phase:c.phase,moving:c.moving,look:c.look,name:"",say:c.arrived&&!c.leaving?{text:`${BY[c.want].n}, please`,t:T}:null,emote:c.happy?{e:"cheer",t:c.happy}:null}});
  if(me.scene==="cyberbuys") for(const c of cbCustomers) ents.push({x:c.x,y:c.y,cust:c,o:{dir:c.dir,phase:c.phase,moving:c.moving,look:c.look,name:"",say:c.arrived&&!c.leaving?{text:cbWantText(c),t:T}:null,emote:c.happy?{e:"cheer",t:c.happy}:null}});
  if(me.scene==="bar") for(const c of customers) ents.push({x:c.x,y:c.y,cust:c,o:{dir:c.dir,phase:c.phase,moving:c.moving,look:c.look,name:"",say:c.arrived&&!c.leaving?{text:wantText(c.want),t:T}:null,emote:c.happy?{e:"cheer",t:c.happy}:null}});
  if(me.scene==="void") for(const b of bots){ if(b.dead&&T-b.deadT>1.6) continue; const B=BOT_TYPES[b.type]||BOT_TYPES.grunt; ents.push({x:b.x,y:b.y,sc:B.sc||1,alpha:B.blink&&!b.dead?(T-(b.blinkedT||-9)<.5?.35+.65*((T-b.blinkedT)/.5):.85+.15*Math.sin(T*9)):null,o:{dir:b.dir,phase:b.phase,moving:b.moving,look:B.look,name:(b.boss?"☠ ":"")+B.n.toUpperCase(),hp:b.hp/b.max*100,dead:b.dead,hurt:b.hurtT,block:false,emote:b.atkT&&T-b.atkT<.35?{e:"atk",t:b.atkT}:null}}); }
  ents.push({x:me.x,y:me.y,o:{dir:me.dir,phase:me.phase,moving:me.moving,look:save.look,name:(mySlot>=0||cbSlot>=0||clubSlot>=0||bbSlot>=0||asmSlot>=0?"★ ":"")+(myName||"Runner"),me:true,dcc:dccSym(myId),say:me.say,emote:me.emote,fx:myFx(),sit:me.seat!=null||!!me.homeSit,hp:me.scene==="void"?myHP:null,block:!!me.blocking,dead:!!me.dead,hurt:me.hurtT}});
  ents.sort((a,b)=>a.y-b.y);
    for(const e of ents){ const s=(.85+.3*(e.y-LANE.top)/(LANE.bot-LANE.top))*(e.sc||1); if(e.alpha!=null){ ctx.save(); ctx.globalAlpha=e.alpha; } drawStick(ctx,e.x,e.y,s,e.o,T); if(e.alpha!=null) ctx.restore();
    if(e.cust&&e.cust.arrived&&!e.cust.leaving&&!e.cust.served){ const p=Math.max(0,e.cust.left/e.cust.max), yy=e.y-120*s; ctx.fillStyle="#2a1f44"; ctx.fillRect(e.x-18,yy,36,4); ctx.fillStyle=p>.5?"#43f0a4":p>.25?"#ffb84a":"#ff3fa8"; ctx.fillRect(e.x-18,yy,36*p,4); } }

async function claimName(n){
  if(n.toLowerCase()==="rassir"&&!IS_ADMIN) return "That name is reserved.";

    try{ const ref=DB.doc("handles/"+key); const l=await ref.acquire({holder:myId,ttlMs:5000}); if(!l.acquired) return "Someone is claiming that name right now. Try again in a few seconds.";
      const snap=await ref.get(); const d=snap.exists?snap.data():null; if(d&&d.by&&d.by!==myId) return "That name is taken. Try another.";
      await ref.set({by:myId,name:n,at:Date.now()});
      if(save.handleKey&&save.handleKey!==key){ try{ await DB.doc("handles/"+save.handleKey).set({by:null,name:"",at:Date.now()}); }catch(e){} }
    }catch(e){ return "Couldn't reach the name registry. Check your connection and try again."; }
  }

}

/* ============================================================ PRESENCE */
let lastPush=0, lastSig="";
function pushPresence(force,extra){ if(!ROOM) return; const now=performance.now(); const pos={s:me.scene,h:curHomeKey(),fx:myFx(),hp:me.scene==="void"?Math.round(myHP):null,blk:me.blocking?1:0,dead:me.dead?1:0,seat:me.scene==="club"&&me.seat!=null?me.seat:null,hs:(me.scene==="home"||me.scene==="vip")&&me.homeSit?1:0,x:Math.round(me.x),y:Math.round(me.y),d:me.dir,lk:save.look,st:(mySlot>=0||cbSlot>=0||clubSlot>=0||bbSlot>=0||asmSlot>=0)?1:0};
  const sig=JSON.stringify(pos); if(!force&&(sig===lastSig||now-lastPush<120)) return; lastSig=sig; lastPush=now; ROOM.presence({...pos,...(extra||{})}).catch(()=>{}); }
setInterval(()=>{ if(ROOM) pushPresence(true,{hb:Date.now()}); },20000);
function validLook(l){ return fullLook(l&&typeof l==="object"?l:DEFAULT_LOOK); }
const PEER_STALE=12e4; // a tab that hasn't checked in for this long is treated as gone
function peerKey(p){ return p.by||p.peer; }
function peerStale(p){ return !!(window.claude&&window.claude.provider==="firebase")&&!!p.updatedAt&&Date.now()-p.updatedAt>PEER_STALE; }
function isSelf(p){ return p.isMe||(!!myId&&p.by===myId); }
function applyPeer(p){ if(isSelf(p)) return false; if(p.kind!=="viewer") return false; if(peerStale(p)) return false; const pr=p.presence||{}; if(!SCENES[pr.s]) return false;
  const key=peerKey(p); let q=peers.get(key); const x=clamp(+pr.x||0,0,5000), y=clamp(+pr.y||300,LANE.top,LANE.bot);
  if(q&&q.pid!==p.peer&&(q.updatedAt||0)>(p.updatedAt||0)) return false; // an older tab of the same player: ignore it
  const fresh=!q; if(!q){ q={by:p.by,dx:x,dy:y,phase:0}; peers.set(key,q); if(p.by) resolveNames([p.by]); }
  else if(q.pid&&q.pid!==p.peer){ q.dx=x; q.dy=y; } // same player came back in a new tab: move the one figure, don't add another
  q.pid=p.peer;
  Object.assign(q,{by:p.by,guest:!!p.guest,updatedAt:p.updatedAt||Date.now(),s:pr.s,home:typeof pr.h==="string"?pr.h:null,x,y,dir:pr.d===-1?-1:1,look:validLook(pr.lk),staff:pr.st===1,hp:Number.isFinite(+pr.hp)&&pr.hp!==null?clamp(Math.round(+pr.hp),0,100):100,blk:pr.blk===1,dead:pr.dead===1,fx:FX_KEYS.includes(pr.fx)?pr.fx:null,seat:Number.isInteger(pr.seat)&&pr.seat>=0&&pr.seat<SEATS.length?pr.seat:null,hs:pr.hs===1});
  if(pr.say&&typeof pr.say.text==="string") q.say={text:pr.say.text.slice(0,80),at:Math.min(Date.now(),+pr.say.at||0)};
  if(pr.emote&&["wave","dance","cheer","pose","use"].includes(pr.emote.e)) q.emote={e:pr.emote.e,at:Math.min(Date.now(),+pr.emote.at||0),it:pr.emote.e==="use"&&BY[pr.emote.it]&&BY[pr.emote.it].t==="trip"?pr.emote.it:null}; return fresh; }
async function resolveNames(ids){ if(!USER) return; try{ const ps=await USER.profiles(ids); for(const id of ids) names[id]=(ps[id]&&ps[id].name)||names[id]||"Runner"; }catch(e){} }


/* ============================================================ BOOT */
resize(); hud(); requestAnimationFrame(step); renderTitle("loading");
chatLine(null,(MOBILE?"Welcome to Sector 9. Use the pad (or tap the ground) to move, tap USE or the glowing prompt to interact, and ☰ for everything else.":"Welcome to Sector 9. WASD/arrows to move, E to interact, Enter to chat. Tap players to gift."),"sys");
setInterval(hud,1000);

(async()=>{
  const cl=window.claude; if(!cl||!cl.use){ ACCESS.mode="solo"; updOnline(); chatLine(null,accessNote(),"sys"); renderTitle(save.name?"limited":"signedout"); return; }
  const [u,db,room]=await Promise.all([cl.use("user"),cl.use("db"),cl.use("room")].map(p=>p.catch(()=>null)));
  USER=u;
  if(u){ try{ IS_ADMIN=!!(await u.isOwner()); }catch(e){} updAdminBtn(); try{ myId=await u.id(); if(!save.name) myName=(await u.name())||"Runner"; if(myId) names[myId]=myName; }catch(e){} }
  let canWrite=true; if(u&&myId){ try{ const c=await u.can("data.write"); canWrite=c!==false; }catch(e){} }
  ACCESS.mode=!db?"signedout":!myId?"limited":!canWrite?"readonly":room?"full":"full";
  if(db&&myId&&canWrite){ DB=db;
    try{ const snap=await db.doc(`data/users/${myId}/save`).get(); if(snap.exists){ save=sanitizeSave(snap.data()); hud(); } else { let lu=""; try{ lu=localStorage.getItem("nh_save_uid")||""; }catch(e){} if(lu&&lu!==myId){ save=defaultSave(); myName=(await u.name())||"Runner"; hud(); } } if(save.name){ myName=save.name; names[myId]=myName; } else { persist(); } }catch(e){}
    db.collection("market").orderBy("at","desc").limit(60).onSnapshot(s=>{ market=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>BY[m.item]&&typeof m.seller==="string"&&+m.price>0); const ids=[...new Set(market.map(m=>m.seller))]; resolveNames(ids);  refreshView("trade");},()=>{});
    db.collection("viprooms").onSnapshot(s=>{ const prev=vipRooms; vipRooms={}; s.docs.forEach(d=>{ const v=d.data()||{}; if(!VIP_BY[d.id]) return; vipRooms[d.id]={by:typeof v.by==="string"?v.by:"",until:+v.until||0,open:v.open!==false,invites:Array.isArray(v.invites)?v.invites.filter(x=>typeof x==="string").slice(0,40):[],at:+v.at||0}; });
      resolveNames(Object.values(vipRooms).map(v=>v.by).filter(Boolean));
      for(const [id,v] of Object.entries(vipRooms)){ const was=prev[id]; if(vipSeen&&myId&&v.by!==myId&&vipActive(id)&&v.invites.includes(myId)&&!(was&&was.invites.includes(myId)&&was.by===v.by)) chatLine(null,`${nameOf(v.by)} added you to the guest list for the ${VIP_BY[id].n} backroom at ${sceneName(VIP_BY[id].venue)}.`,"sys"); }
      vipSeen=true; vipCheckAccess(); if(currentView&&currentView.startsWith("vip")&&!$("#overlay").hidden&&!(document.activeElement&&document.activeElement.tagName==="INPUT")) refreshVipPanel(); },()=>{});
    db.collection("dcc").onSnapshot(s=>{ const was=dccActive(myId); dcc={}; s.docs.forEach(d=>{ const v=d.data()||{}; dcc[d.id]={on:v.on===true,until:+v.until||0,sym:Math.max(0,Math.min(DCC_SYMS.length-1,Math.floor(+v.sym||0))),at:+v.at||0}; }); resolveNames(Object.keys(dcc));
      if(!was&&dccActive(myId)&&dccSeen){ toast(`Welcome to the Data Collectors Club! Your ${DCC_SYMS[dccSym(myId)].n} symbol now shows next to your name.`,"#43f0a4"); beep(1200,.12); } dccSeen=true; refreshSmacked();
      if(currentView&&currentView.startsWith("admin")&&!$("#overlay").hidden&&!(document.activeElement&&["INPUT","SELECT"].includes(document.activeElement.tagName))) refreshAdmin(); },()=>{});
    db.collection("homes").limit(100).onSnapshot(s=>{ homes={}; s.docs.forEach(d=>homes[d.id]=d.data()); resolveNames(Object.keys(homes)); if(viewHome&&homes[viewHome.owner]){ const h=homes[viewHome.owner]; viewHome.display=Array.from({length:6},(_,i)=>BY[(h.display||[])[i]]?h.display[i]:null); viewHome.label=nameOf(viewHome.owner); } },()=>{});
    for(const x of save.settled||[]) settled.add(x);
    // Smacked Shop
    if(IS_ADMIN){ try{ ASSETS=await cl.use("assets"); }catch(e){} }
    db.collection("shop").onSnapshot(s=>{ shopItems=s.docs.map(d=>cleanItem(d.id,d.data())).filter(Boolean); refreshSmacked(); },()=>{});
    db.doc("shopinfo/main").onSnapshot(s=>{ shopInfo={text:s.exists?String((s.data()||{}).text||"").slice(0,600):""}; refreshSmacked(); },()=>{});
    db.collection("pickups").onSnapshot(s=>{ pickupStatus={}; s.docs.forEach(d=>{ const v=d.data()||{}; if(["ready","picked","cancelled"].includes(v.status)) pickupStatus[d.id]={status:v.status}; }); checkRefunds(); if(IS_ADMIN) syncSold(); refreshSmacked(); },()=>{});
    db.doc("redeem/"+myId).onSnapshot(s=>{ const d=s.exists?s.data():null; myRedeem={codes:Array.isArray(d&&d.codes)?d.codes.filter(e=>e&&typeof e.code==="string").map(e=>({...e})):[]}; Promise.all(myRedeem.codes.map(e=>hashOf(e.code))).then(()=>{ checkRefunds(); refreshSmacked(); }); },()=>{});
    if(IS_ADMIN) db.collection("redeem").onSnapshot(s=>{ allRedeem={}; s.docs.forEach(d=>allRedeem[d.id]=d.data()); resolveNames(Object.keys(allRedeem)); syncSold().then(refreshSmacked); },()=>{});
    for(const field of ["a","b"]) db.collection("duels").where(field,"==",myId).onSnapshot(s=>{ for(const ch of s.docChanges()){ if(ch.type==="removed") continue; const d={id:ch.doc.id,...ch.doc.data()}; if(!GAMES[d.game]||typeof d.a!=="string"||typeof d.b!=="string") continue; duels.set(d.id,d); handleDuel(d); } },()=>{});
    startInbox(db); watchLand(db);
    giftUnsub=db.collection("gifts").where("to","==",myId).onSnapshot(s=>{ for(const ch of s.docChanges()) if(ch.type==="added") claimGift(ch.doc); },()=>{});
    db.collection("clubstaff").onSnapshot(s=>{ const nx=[null,null,null,null]; s.docs.forEach(d=>{ const m=/^slot([0-3])$/.exec(d.id); if(m) nx[+m[1]]=d.data(); }); clubSlots=nx;
      if(clubSlot>=0){ const mine=nx[clubSlot]; if(!mine||mine.by!==myId){ clubSlot=-1; clearInterval(clubBeat); clubShift=null; clubHolding=null; toast("Your club shift slot was released."); } }
      resolveNames(nx.filter(x=>x&&x.by).map(x=>x.by)); },()=>{});
    db.doc("club/stage").onSnapshot(s=>{ const d=s.exists?s.data():null; const i=d?Math.floor(+d.track):-1; if(d&&i>=0&&i<TRACKS.length){ if(i!==clubTrack) step16=0; clubTrack=i; clubTrackBy=typeof d.by==="string"&&d.by?d.by:null; if(clubTrackBy) resolveNames([clubTrackBy]); } },()=>{});
    db.collection("cbstaff").onSnapshot(s=>{ const nx=[null,null,null,null]; s.docs.forEach(d=>{ const m=/^slot([0-3])$/.exec(d.id); if(m) nx[+m[1]]=d.data(); }); cbSlots=nx;
      if(cbSlot>=0){ const mine=nx[cbSlot]; if(!mine||mine.by!==myId){ cbSlot=-1; clearInterval(cbBeat); cbShift=null; cbHolding=null; toast("Your register slot was released."); } }
      resolveNames(nx.filter(x=>x&&x.by).map(x=>x.by)); },()=>{});
    db.collection("staff").onSnapshot(s=>{ const nx=[null,null,null,null], bb=[null,null,null,null], asmNext=Array(ASM_BAYS).fill(null); s.docs.forEach(d=>{ const m=/^slot([0-3])$/.exec(d.id); if(m) nx[+m[1]]=d.data(); const b=/^bbslot([0-3])$/.exec(d.id); if(b) bb[+b[1]]=d.data(); const am=/^asm([0-9])$/.exec(d.id); if(am) asmNext[+am[1]]=d.data(); }); asmSlots=asmNext; if(currentView==="asmboard"&&!$("#overlay").hidden) openAsmBoard(); staffSlots=nx; bbSlots=bb;
      if(mySlot>=0){ const mine=nx[mySlot]; if(!mine||mine.by!==myId){ mySlot=-1; clearInterval(beatTimer); shift=null; toast("Your shift slot was released."); } }
      resolveNames(nx.filter(x=>x&&x.by).map(x=>x.by)); refreshView("orders"); },()=>{});
    let firstOrders=true;
    db.collection("orders").where("to","==",myId).onSnapshot(s=>{ incomingOrders=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>typeof o.from==="string"&&(o.kind==="club"?(BY[o.item]&&BY[o.item].t==="trip"):(o.kind==="drink"||o.kind==="food")?orderMenuId(o):TYPE_N[o.ptype]));
      if(!firstOrders) for(const ch of s.docChanges()) if(ch.type==="added"){ toast(`New order from ${nameOf(ch.doc.data().from)}. Check the counter.`,"#ffb84a"); beep(1200,.08); }
      firstOrders=false; resolveNames(incomingOrders.map(o=>o.from)); },()=>{});
    db.collection("orders").where("from","==",myId).onSnapshot(s=>{ myOrders=s.docs.map(d=>({id:d.id,...d.data()})); resolveNames(myOrders.map(o=>o.to)); refreshView("orders"); },()=>{});
    lastHomeSig=""; flush();
    renderTitle(save.name?"returning":"new");
  } else { chatLine(null,accessNote(),"sys"); renderTitle(ACCESS.mode==="signedout"?"signedout":"limited"); }
  if(room){ ROOM=room;
    room.onPeers(ch=>{ const arrived=[]; for(const p of ch.joined.concat(ch.updated)) if(applyPeer(p)&&ch.joined.includes(p)) arrived.push(p); try{ syncPeers(room.peers()); }catch(e){ for(const p of ch.left){ const q=peers.get(peerKey(p)); if(q&&q.pid===p.peer) peers.delete(peerKey(p)); } } for(const p of arrived) setTimeout(()=>chatLine(null,`${nameOf(p.by)} arrived in ${sceneName((p.presence||{}).s)||"Sector 9"}`,"sys"),300); updOnline(); },()=>{});
    room.on("chat",m=>{ if(m.isMe&&m.sameTab) return; const d=m.data||{}; if(typeof d.text!=="string") return; chatLine(nameOf(m.by),d.text.slice(0,80),undefined,m.by); });
    room.on("atk",onAtk); room.on("ko",onKo);
    room.on("invite",m=>{ if(m.isMe||!m.by||m.by===myId) return; const d=m.data||{}; if(d.to!==myId) return; resolveNames([m.by]);
      if(typeof d.vip==="string"&&VIP_BY[d.vip]){ const R=VIP_BY[d.vip]; card(`${nameOf(m.by)} invited you to the ${R.n} backroom at ${sceneName(R.venue)}.`,[["Go there",()=>{ closePanel(); enterVip(R.id); },true],["Not now",null]],120e3); return; }
      card(`${nameOf(m.by)} invited you to their apartment.`,[["Go there",()=>{ closePanel(); if(me.scene==="bar"&&mySlot>=0) clockOut(); visitHome(m.by); },true],["Not now",null]],90e3); });
    room.on("news",m=>{ if(m.isMe&&m.sameTab) return; const d=m.data||{}; if(typeof d.text!=="string") return; chatLine(null,`${nameOf(m.by)} ${d.text.slice(0,90)}`,"sys"); });
    for(const p of room.peers()) applyPeer(p); updOnline(); pushPresence(true);
  } else { updOnline(); if(ACCESS.mode==="full") chatLine(null,"Multiplayer couldn't connect in this view. Try reloading the page.","sys"); }
})();
})();
</script>
</body>
